# Paste into rbln-mp-test's Steps editor. The upload job needs no NPU/image.
# Test jobs use ghcr.io/rebellions-sw/rbln-test:latest unless RBLN_CI_IMAGE is set.
agents:
  queue: rbln-queue

steps:
  - label: ":pipeline: Upload RBLN pipeline"
    command: bash .buildkite/k3_tests/common_scripts/upload-pipeline.sh .buildkite/rbln/pipeline.yml
